<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로또 번호 생성기</title>
<style>
  body { font-family: sans-serif; text-align: center; padding-top: 60px; background: #f5f5f5; }
  .balls { margin: 30px 0; min-height: 60px; }
  .ball { display: inline-block; width: 50px; height: 50px; line-height: 50px; margin: 5px;
          border-radius: 50%; color: #fff; font-weight: bold; font-size: 20px; }
  button { font-size: 18px; padding: 10px 24px; cursor: pointer; }
</style>
</head>
<body>
  <h1>로또 번호 생성기</h1>
  <div class="balls" id="balls"></div>
  <button onclick="generate()">번호 뽑기</button>

<script>
  function color(n) {
    if (n <= 10) return "#fbc400";
    if (n <= 20) return "#69c8f2";
    if (n <= 30) return "#ff7272";
    if (n <= 40) return "#aaaaaa";
    return "#b0d840";
  }

  function generate() {
    const nums = new Set();
    while (nums.size < 6) nums.add(Math.floor(Math.random() * 45) + 1);
    const sorted = [...nums].sort((a, b) => a - b);
    document.getElementById("balls").innerHTML = sorted
      .map(n => `<span class="ball" style="background:${color(n)}">${n}</span>`)
      .join("");
  }

  generate();
</script>
</body>
</html>
